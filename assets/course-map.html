<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TypeScript 全栈学习路线</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #fdfdfd;
      --color-ink:     #1a1a1a;
      --color-muted:   #555555;
      --color-accent:  #3178c6;
      --font-sans:     'Geist', 'Hiragino Sans', 'PingFang SC', 'Noto Sans CJK SC', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Songti SC', 'Noto Serif CJK SC', serif;
      --font-mono:     'Geist Mono', 'Noto Sans Mono CJK SC', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 0.4rem;
    }

    .subtitle {
      font-size: 0.95rem;
      color: var(--color-muted);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 1000px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Course Map · 19 Lessons</p>
    <h1>TypeScript 全栈学习路线</h1>
    <p class="subtitle">19 课 · 从 C#/Java 迁移到全栈</p>

    <svg viewBox="0 0 1176 488" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="course-map-title course-map-desc">
      <title id="course-map-title">TypeScript 全栈学习路线（19 课）</title>
      <desc id="course-map-desc">三阶段学习路线图：语言核心（0001–0011）含 Todo API 里程碑，经生态四层（0012–0015）到差异化进阶（0016–0019），标注三处 C#/Java 对照锚点。</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#555555"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#3178c6"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <!-- Background -->
      <rect width="100%" height="100%" fill="#fdfdfd"/>

      <!-- ============ Zones (drawn before arrows and nodes) ============ -->
      <!-- Stage 1 -->
      <rect x="40" y="56" width="936" height="152" rx="8"
            fill="rgba(26,26,26,0.02)" stroke="rgba(26,26,26,0.10)" stroke-width="0.8"/>
      <rect x="48" y="60" width="88" height="12" rx="2" fill="#fdfdfd"/>
      <text x="92" y="69" fill="#555555" font-size="9" font-family="'Geist Mono', 'Noto Sans Mono CJK SC', ui-monospace, monospace"
            text-anchor="middle">阶段一 · 语言核心</text>
      <!-- Stage 2 -->
      <rect x="832" y="256" width="144" height="144" rx="8"
            fill="rgba(26,26,26,0.02)" stroke="rgba(26,26,26,0.10)" stroke-width="0.8"/>
      <rect x="860" y="260" width="88" height="12" rx="2" fill="#fdfdfd"/>
      <text x="904" y="269" fill="#555555" font-size="9" font-family="'Geist Mono', 'Noto Sans Mono CJK SC', ui-monospace, monospace"
            text-anchor="middle">阶段二 · 生态四层</text>
      <!-- Stage 3 -->
      <rect x="992" y="256" width="144" height="144" rx="8"
            fill="rgba(26,26,26,0.02)" stroke="rgba(26,26,26,0.10)" stroke-width="0.8"/>
      <rect x="1016" y="260" width="96" height="12" rx="2" fill="#fdfdfd"/>
      <text x="1064" y="269" fill="#555555" font-size="9" font-family="'Geist Mono', 'Noto Sans Mono CJK SC', ui-monospace, monospace"
            text-anchor="middle">阶段三 · 差异化进阶</text>

      <!-- ============ Arrows (before nodes) ============ -->
      <!-- Stage 1 linear flow -->
      <line x1="168" y1="136" x2="188" y2="136" stroke="#555555" stroke-width="1" marker-end="url(#arrow)"/>
      <line x1="300" y1="136" x2="320" y2="136" stroke="#555555" stroke-width="1" marker-end="url(#arrow)"/>
      <line x1="432" y1="136" x2="452" y2="136" stroke="#555555" stroke-width="1" marker-end="url(#arrow)"/>
      <line x1="564" y1="136" x2="584" y2="136" stroke="#555555" stroke-width="1" marker-end="url(#arrow)"/>
      <line x1="696" y1="136" x2="716" y2="136" stroke="#555555" stroke-width="1" marker-end="url(#arrow)"/>
      <line x1="828" y1="136" x2="848" y2="136" stroke="#555555" stroke-width="1" marker-end="url(#arrow)"/>
      <!-- Stage 1 → Stage 2 (accent: the turn into the ecosystem) -->
      <line x1="904" y1="176" x2="904" y2="288" stroke="#3178c6" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
      <!-- Stage 2 → Stage 3 -->
      <line x1="960" y1="328" x2="1008" y2="328" stroke="#555555" stroke-width="1" marker-end="url(#arrow)"/>

      <!-- ============ Nodes ============ -->
      <!-- Node 1: TS 心智模型 -->
      <rect x="56" y="96" width="112" height="80" rx="6" fill="#fdfdfd"/>
      <rect x="56" y="96" width="112" height="80" rx="6" fill="rgba(85,85,85,0.10)" stroke="#888888" stroke-width="1"/>
      <text x="112" y="126" fill="#1a1a1a" font-size="12" font-weight="600"
            font-family="'Geist', 'Hiragino Sans', 'PingFang SC', 'Noto Sans CJK SC', sans-serif" text-anchor="middle">TS 心智模型</text>
      <text x="112" y="142" fill="#555555" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">0001</text>
      <text x="112" y="158" fill="#888888" font-size="9" font-family="'Geist Mono', 'Noto Sans Mono CJK SC', ui-monospace, monospace" text-anchor="middle">类型擦除</text>

      <!-- Node 2: 类型系统差异 -->
      <rect x="188" y="96" width="112" height="80" rx="6" fill="#fdfdfd"/>
      <rect x="188" y="96" width="112" height="80" rx="6" fill="rgba(85,85,85,0.10)" stroke="#888888" stroke-width="1"/>
      <text x="244" y="126" fill="#1a1a1a" font-size="12" font-weight="600"
            font-family="'Geist', 'Hiragino Sans', 'PingFang SC', 'Noto Sans CJK SC', sans-serif" text-anchor="middle">类型系统差异</text>
      <text x="244" y="142" fill="#555555" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">0002–0004</text>
      <text x="244" y="158" fill="#7a3e9d" font-size="9" font-family="'Geist Mono', 'Noto Sans Mono CJK SC', ui-monospace, monospace" text-anchor="middle">对照 · 结构类型</text>

      <!-- Node 3: 泛型与函数 -->
      <rect x="320" y="96" width="112" height="80" rx="6" fill="#fdfdfd"/>
      <rect x="320" y="96" width="112" height="80" rx="6" fill="rgba(85,85,85,0.10)" stroke="#888888" stroke-width="1"/>
      <text x="376" y="126" fill="#1a1a1a" font-size="12" font-weight="600"
            font-family="'Geist', 'Hiragino Sans', 'PingFang SC', 'Noto Sans CJK SC', sans-serif" text-anchor="middle">泛型与函数</text>
      <text x="376" y="142" fill="#555555" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">0005–0006</text>
      <text x="376" y="158" fill="#7a3e9d" font-size="9" font-family="'Geist Mono', 'Noto Sans Mono CJK SC', ui-monospace, monospace" text-anchor="middle">对照 · 泛型约束</text>

      <!-- Node 4: 类与异步 -->
      <rect x="452" y="96" width="112" height="80" rx="6" fill="#fdfdfd"/>
      <rect x="452" y="96" width="112" height="80" rx="6" fill="rgba(85,85,85,0.10)" stroke="#888888" stroke-width="1"/>
      <text x="508" y="126" fill="#1a1a1a" font-size="12" font-weight="600"
            font-family="'Geist', 'Hiragino Sans', 'PingFang SC', 'Noto Sans CJK SC', sans-serif" text-anchor="middle">类与异步</text>
      <text x="508" y="142" fill="#555555" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">0007–0008</text>

      <!-- Node 5: 模块与工程 -->
      <rect x="584" y="96" width="112" height="80" rx="6" fill="#fdfdfd"/>
      <rect x="584" y="96" width="112" height="80" rx="6" fill="rgba(85,85,85,0.10)" stroke="#888888" stroke-width="1"/>
      <text x="640" y="126" fill="#1a1a1a" font-size="12" font-weight="600"
            font-family="'Geist', 'Hiragino Sans', 'PingFang SC', 'Noto Sans CJK SC', sans-serif" text-anchor="middle">模块与工程</text>
      <text x="640" y="142" fill="#555555" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">0009</text>

      <!-- Node 6: Todo API（focal 里程碑） -->
      <rect x="716" y="96" width="112" height="80" rx="6" fill="#fdfdfd"/>
      <rect x="716" y="96" width="112" height="80" rx="6" fill="#e8f0fa" stroke="#3178c6" stroke-width="1.2"/>
      <text x="772" y="126" fill="#1a1a1a" font-size="12" font-weight="600"
            font-family="'Geist', 'Hiragino Sans', 'PingFang SC', 'Noto Sans CJK SC', sans-serif" text-anchor="middle">Todo API</text>
      <text x="772" y="142" fill="#555555" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">0010</text>
      <text x="772" y="158" fill="#3178c6" font-size="9" font-family="'Geist Mono', 'Noto Sans Mono CJK SC', ui-monospace, monospace" text-anchor="middle">里程碑</text>

      <!-- Node 7: 类型编程 -->
      <rect x="848" y="96" width="112" height="80" rx="6" fill="#fdfdfd"/>
      <rect x="848" y="96" width="112" height="80" rx="6" fill="rgba(85,85,85,0.10)" stroke="#888888" stroke-width="1"/>
      <text x="904" y="126" fill="#1a1a1a" font-size="12" font-weight="600"
            font-family="'Geist', 'Hiragino Sans', 'PingFang SC', 'Noto Sans CJK SC', sans-serif" text-anchor="middle">类型编程</text>
      <text x="904" y="142" fill="#555555" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">0011</text>

      <!-- Node 8: 生态四层（focal） -->
      <rect x="848" y="288" width="112" height="80" rx="6" fill="#fdfdfd"/>
      <rect x="848" y="288" width="112" height="80" rx="6" fill="#e8f0fa" stroke="#3178c6" stroke-width="1.2"/>
      <text x="904" y="318" fill="#1a1a1a" font-size="12" font-weight="600"
            font-family="'Geist', 'Hiragino Sans', 'PingFang SC', 'Noto Sans CJK SC', sans-serif" text-anchor="middle">生态四层</text>
      <text x="904" y="334" fill="#555555" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">0012–0015</text>
      <text x="904" y="350" fill="#7a3e9d" font-size="9" font-family="'Geist Mono', 'Noto Sans Mono CJK SC', ui-monospace, monospace" text-anchor="middle">vs .NET 生态</text>

      <!-- Node 9: 差异化进阶（optional dashed） -->
      <rect x="1008" y="288" width="112" height="80" rx="6" fill="#fdfdfd"/>
      <rect x="1008" y="288" width="112" height="80" rx="6" fill="rgba(26,26,26,0.02)" stroke="rgba(26,26,26,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="1064" y="318" fill="#1a1a1a" font-size="12" font-weight="600"
            font-family="'Geist', 'Hiragino Sans', 'PingFang SC', 'Noto Sans CJK SC', sans-serif" text-anchor="middle">差异化进阶</text>
      <text x="1064" y="334" fill="#555555" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">0016–0019</text>
      <text x="1064" y="350" fill="#888888" font-size="9" font-family="'Geist Mono', 'Noto Sans Mono CJK SC', ui-monospace, monospace" text-anchor="middle">可选扩展</text>

      <!-- ============ Legend (horizontal strip at bottom) ============ -->
      <line x1="40" y1="428" x2="1136" y2="428" stroke="rgba(26,26,26,0.10)" stroke-width="0.8"/>
      <text x="48" y="448" fill="#555555" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">LEGEND</text>

      <!-- Item 1: focal milestone -->
      <rect x="160" y="442" width="16" height="12" rx="2" fill="#e8f0fa" stroke="#3178c6" stroke-width="1"/>
      <text x="184" y="452" fill="#555555" font-size="9" font-family="'Geist', 'Hiragino Sans', 'PingFang SC', 'Noto Sans CJK SC', sans-serif">里程碑节点 0010 · 0015</text>

      <!-- Item 2: optional -->
      <rect x="420" y="442" width="16" height="12" rx="2" fill="rgba(26,26,26,0.02)" stroke="rgba(26,26,26,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="444" y="452" fill="#555555" font-size="9" font-family="'Geist', 'Hiragino Sans', 'PingFang SC', 'Noto Sans CJK SC', sans-serif">可选进阶 0016–0019</text>

      <!-- Item 3: C#/Java comparison -->
      <rect x="680" y="442" width="16" height="12" rx="2" fill="#f3eef8" stroke="#7a3e9d" stroke-width="1"/>
      <text x="704" y="452" fill="#555555" font-size="9" font-family="'Geist', 'Hiragino Sans', 'PingFang SC', 'Noto Sans CJK SC', sans-serif">C#/Java 对照锚点</text>

      <!-- Item 4: main flow -->
      <line x1="940" y1="448" x2="968" y2="448" stroke="#555555" stroke-width="1" marker-end="url(#arrow)"/>
      <text x="980" y="452" fill="#555555" font-size="9" font-family="'Geist', 'Hiragino Sans', 'PingFang SC', 'Noto Sans CJK SC', sans-serif">学习主线 · 按课序</text>
    </svg>
  </div>
</body>
</html>
